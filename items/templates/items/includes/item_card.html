
{% load static %}

{% if item.is_available %}
<a class="item-card" href="{% url 'items:item_detail' item.id %}">
    <div class="item-card-visual">
        <img
            src="{% static 'items/images/clothing.jpg' %}"
            alt="{{ item.item_name }}"
            class="item-card-image"
        >
        <span class="item-size">
            {{ item.size|default:"Размер не указан"|upper }}
        </span>
        <span class="item-available">Вещь ждёт владельца</span>
        <span class="item-visual-mark" aria-hidden="true">↻</span>
    </div>
    <div class="item-card-info">
        <p class="item-condition">{{ item.condition|capfirst }}</p>
        <h3>{{ item.item_name|capfirst }}</h3>
        <p class="item-owner">Владелец: {{ item.owner_name|capfirst }}</p>
    </div>
</a>
{% endif %}
